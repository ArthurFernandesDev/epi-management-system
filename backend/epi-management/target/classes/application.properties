# =============================================
# Configurações do EPI Management System
# =============================================

# Nome da aplicação
spring.application.name=epi-management

# ---- Banco de Dados H2 (em memória) ----
# URL do banco: "epidb" é o nome do banco em memória
spring.datasource.url=jdbc:h2:mem:epidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate ----
# create-drop: cria as tabelas ao iniciar e apaga ao parar
# Para manter os dados entre reinicializações, use: update
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ---- Console H2 (acesse em http://localhost:8080/h2-console) ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Porta da aplicação ----
server.port=8080

# ---- Mensagens de erro mais detalhadas ----
server.error.include-message=always
server.error.include-binding-errors=always
